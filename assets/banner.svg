<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes waveDash {
        to { stroke-dashoffset: -1200; }
      }
      @keyframes nodeFlicker {
        0%, 100% { opacity: 0.4; r: 3px; }
        50% { opacity: 1; r: 5px; }
      }

      .floating-badge-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-badge-2 { animation: floatRev 7s ease-in-out infinite 1s; }
      .floating-badge-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
      .floating-badge-4 { animation: floatRev 6.5s ease-in-out infinite 1.5s; }
      .ambient-glow { animation: pulseLight 8s ease-in-out infinite; transform-origin: 600px 200px; }
      .wave-anim-1 { stroke-dasharray: 12 8; animation: waveDash 35s linear infinite; }
      .wave-anim-2 { stroke-dasharray: 8 6; animation: waveDash 25s linear infinite reverse; }
      .data-node-a { animation: nodeFlicker 3s ease-in-out infinite; }
      .data-node-b { animation: nodeFlicker 4s ease-in-out infinite 1.5s; }
      .data-node-c { animation: nodeFlicker 3.5s ease-in-out infinite 0.8s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Perspective Analytics Grid -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.75">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Nebulas (Kept behind foreground text) -->
  <circle class="ambient-glow" cx="600" cy="200" r="320" fill="url(#glowPulse)" />
  <circle cx="180" cy="110" r="180" fill="url(#cyanGlow)" />
  <circle cx="1020" cy="310" r="210" fill="url(#glowPulse)" />

  <!-- Animated Dynamic Data Stream / Chart Curves (Flows safely across bottom/lower area) -->
  <g fill="none" opacity="0.65">
    <!-- Stream ribbon 1 -->
    <path class="wave-anim-1" stroke="url(#lineGrad)" stroke-width="2.5" 
          d="M -50 360 C 180 320, 320 395, 520 340 C 720 285, 920 380, 1250 310" />
    <!-- Stream ribbon 2 -->
    <path class="wave-anim-2" stroke="url(#streamGrad)" stroke-width="3" 
          d="M -50 310 C 220 380, 420 300, 680 360 C 900 410, 1080 320, 1250 350" />
  </g>

  <!-- Pulsing Data Nodes / Query Vertices -->
  <g fill="#38bdf8">
    <circle class="data-node-a" cx="240" cy="345" r="4" />
    <circle class="data-node-b" cx="520" cy="340" r="4" fill="#a855f7" />
    <circle class="data-node-c" cx="720" cy="290" r="4" fill="#34d399" />
    <circle class="data-node-a" cx="950" cy="365" r="4" />
    <circle class="data-node-b" cx="1080" cy="325" r="4" fill="#ec4899" />
  </g>

  <!-- Dynamic Animated Metric Card Pills (Framed nicely, away from central titles) -->
  <!-- Top Left Pill -->
  <g class="floating-badge-1" transform="translate(75, 42)">
    <rect width="190" height="36" rx="18" fill="#131e3a" stroke="#2563eb" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">⚡ MCP Agent Ready</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-badge-2" transform="translate(930, 42)">
    <rect width="195" height="36" rx="18" fill="#1e1838" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">💬 Natural Language BI</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-badge-3" transform="translate(85, 335)">
    <rect width="195" height="36" rx="18" fill="#0d2528" stroke="#14b8a6" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#2dd4bf" />
    <text x="36" y="23" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">🔮 Automated Insights</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-badge-4" transform="translate(925, 335)">
    <rect width="200" height="36" rx="18" fill="#241228" stroke="#d946ef" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="20" cy="18" r="5" fill="#f472b6" />
    <text x="36" y="23" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">🤖 Agentic Data Analysts</text>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle (Guaranteed Unobscured & Crystal Clear) -->
  <g id="foreground" text-anchor="middle">
    <!-- Top Super-header / Category Tag -->
    <text x="600" y="112" fill="#38bdf8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" font-weight="700" letter-spacing="3" text-transform="uppercase">
      THE CURATED DIRECTORY &amp; ECOSYSTEM
    </text>

    <!-- Main Title with Glowing Gradient Fill -->
    <text x="600" y="175" fill="url(#titleGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#neonGlow)">
      Awesome AI-Powered Analytics
    </text>

    <!-- Secondary Overlay for Crisp Sharp Text Edges -->
    <text x="600" y="175" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="44" font-weight="800" letter-spacing="-0.5" fill-opacity="0.95">
      Awesome AI-Powered Analytics
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" fill="#cbd5e1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" font-weight="400">
      Next-Generation Conversational BI, Autonomous Agents &amp; Semantic Intelligence
    </text>

    <!-- Feature Attribute Badges Bar in Center -->
    <g transform="translate(290, 252)">
      <!-- Badge 1: SaaS Leaders -->
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="70" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        🏢 SaaS Leaders
      </text>

      <!-- Badge 2: Open Source -->
      <rect x="155" y="0" width="145" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="227" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        🔓 Open-Source Engines
      </text>

      <!-- Badge 3: Text-to-SQL -->
      <rect x="315" y="0" width="140" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="385" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        💡 Text-to-SQL / NLQ
      </text>

      <!-- Badge 4: MCP Protocols -->
      <rect x="470" y="0" width="150" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="545" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
        🔌 MCP Architecture
      </text>
    </g>
  </g>
</svg>
